<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>RAGEVERSE</title>
  <meta name="description" content="Zerstöre alles. Wachse. Zerstöre größere Dinge. Vom Gartenzwerg bis zur Galaxie.">
  <meta name="theme-color" content="#1a0b0b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23e8262b'/%3E%3Ccircle cx='35' cy='45' r='10' fill='white'/%3E%3Ccircle cx='65' cy='45' r='10' fill='white'/%3E%3Cpath d='M22 28 L45 38 M78 28 L55 38' stroke='%232a0606' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ============ HUD (während des Runs) ============ -->
  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-world">
        <span id="hud-world-name">Garten</span>
        <div class="bar small"><div id="hud-world-bar"></div></div>
        <span id="hud-world-next" class="muted">→ Straße</span>
      </div>
      <div class="hud-rage">
        <div class="rage-label">WUT</div>
        <div class="bar rage"><div id="hud-rage-bar"></div></div>
      </div>
      <div class="hud-scrap"><span class="gear">⚙</span><span id="hud-scrap">0</span></div>
    </div>
    <div id="hud-combo" class="combo" hidden></div>
    <div id="hud-event" class="event-banner" hidden></div>
    <div id="hud-muts" class="muts"></div>
    <button id="btn-pause" class="icon-btn hud-pause" aria-label="Pause">❚❚</button>
    <button id="btn-dash" class="dash-btn" aria-label="Rammstoß">⚡</button>
  </div>

  <div id="banner" class="world-banner" hidden></div>

  <!-- ============ Hauptmenü ============ -->
  <section id="screen-menu" class="screen">
    <div class="panel menu">
      <h1 class="logo">RAGE<span>VERSE</span></h1>
      <p class="tagline">Zerstöre alles. Wachse. Zerstöre größere Dinge.</p>
      <div class="menu-stats" id="menu-stats"></div>
      <div class="btn-col">
        <button class="btn primary big" id="btn-play">WÜTEN!</button>
        <button class="btn" id="btn-shop-menu">Werkstatt <span class="pill" id="menu-scrap">⚙ 0</span></button>
      </div>
      <p class="help">Maus / Finger steuert · <b>Leertaste</b> / Doppeltipp = Rammstoß · <b>P</b> = Pause</p>
    </div>
  </section>

  <!-- ============ Werkstatt / Shop ============ -->
  <section id="screen-shop" class="screen" hidden>
    <div class="panel shop">
      <div class="shop-head">
        <h2>Werkstatt</h2>
        <div class="pill big-pill">⚙ <span id="shop-scrap">0</span></div>
      </div>
      <div class="shop-grid" id="shop-grid"></div>
      <div class="btn-row">
        <button class="btn" id="btn-shop-back">Menü</button>
        <button class="btn primary" id="btn-shop-play">Nächster Run</button>
      </div>
    </div>
  </section>

  <!-- ============ Ergebnis ============ -->
  <section id="screen-results" class="screen" hidden>
    <div class="panel results">
      <h2>Wut verraucht!</h2>
      <div id="results-body"></div>
      <div class="btn-row">
        <button class="btn" id="btn-res-shop">Werkstatt</button>
        <button class="btn primary" id="btn-res-again">Nochmal!</button>
      </div>
    </div>
  </section>

  <!-- ============ Mutation wählen ============ -->
  <section id="screen-mutation" class="screen dim" hidden>
    <div class="mutation-wrap">
      <div class="mut-title" id="mut-title">STRASSE ERREICHT!</div>
      <p class="mut-sub">Wähle eine Mutation für diesen Run</p>
      <div class="mut-cards" id="mut-cards"></div>
    </div>
  </section>

  <!-- ============ Pause ============ -->
  <section id="screen-pause" class="screen dim" hidden>
    <div class="panel small-panel">
      <h2>Pause</h2>
      <div class="btn-col">
        <button class="btn primary" id="btn-resume">Weiter</button>
        <button class="btn" id="btn-quit">Run beenden</button>
      </div>
    </div>
  </section>

  <!-- ============ Ecke: Patch Notes / Ton / Update-Hinweis ============ -->
  <div id="corner">
    <div id="toast" class="toast" hidden></div>
    <div class="corner-btns">
      <button class="corner-btn" id="btn-notes" aria-label="Patch Notes">📜 <span class="lbl">Patch Notes</span><i class="dot" id="notes-dot" hidden></i></button>
      <button class="corner-btn" id="btn-mute" aria-label="Ton an/aus">🔊</button>
      <span class="ver" id="ver"></span>
    </div>
  </div>

  <!-- ============ Patch Notes Fenster ============ -->
  <section id="notes-modal" class="screen dim" hidden>
    <div class="panel notes">
      <div class="shop-head">
        <h2>Patch Notes</h2>
        <button class="icon-btn" id="btn-notes-close" aria-label="Schließen">✕</button>
      </div>
      <div class="notes-list" id="notes-list"></div>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
