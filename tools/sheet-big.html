<!doctype html><meta charset="utf-8"><title>Monster groß</title>
<body style="margin:0;background:#4a7d45"><canvas id="c" width="1400" height="900"></canvas>
<script type="module">
import * as C from '../js/config.js';
import { drawMonster } from '../js/monster.js';
const q = new URLSearchParams(location.search), skin = q.get('skin'), st = Number(q.get('stage') || 0), punch = q.get('punch');
const c = document.getElementById('c').getContext('2d');
c.fillStyle = '#4a7d45'; c.fillRect(0, 0, 1400, 900);
C.CHARACTERS.forEach((ch, i) => {
  const X = 150 + (i % 6) * 220, Y = 380 + Math.floor(i / 6) * 420;
  drawMonster(c, X, Y, 72, { char: ch, stage: st, face: 1, walk: 0.3, punchT: punch ? 0.15 : 0, punchX: 1, punchY: 0, hurtT: 0, berserk: false, squash: 0, time: 1.3, lookX: 0.5, lookY: 0, skin });
  c.fillStyle = '#fff'; c.font = 'bold 16px sans-serif'; c.textAlign = 'center'; c.fillText(ch.name, X, Y + 50);
});
</script>
